version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aether_db_user
      POSTGRES_PASSWORD: aether_db_password_99
      POSTGRES_DB: realestate_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aether-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
